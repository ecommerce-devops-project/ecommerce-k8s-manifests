apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: cluster-pod-reader

rules:
- apiGroups: [""]
  resources:
    - pods
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
  verbs:
    - get
    - list
    - watch    

- apiGroups: [""]
  resources:
    - services
  verbs:
    - get
    - list
    - watch    

- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers
  verbs:
    - get
    - list
    - watch    