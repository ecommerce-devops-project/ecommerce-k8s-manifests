apiVersion: v1
kind: PersistentVolume

metadata:
  name: ecommerce-backend-pv

spec:
  capacity:
    storage: 1Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  hostPath:
    path: /data/ecommerce-backend
    type: DirectoryOrCreate