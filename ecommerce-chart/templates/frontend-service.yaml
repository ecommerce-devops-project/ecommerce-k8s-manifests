apiVersion: v1
kind: Service

metadata:
  name: ecommers-frontend-service
  namespace: ecommerce

spec:
  selector:
    app: ecommers-frontend

  ports:
    - protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}

  type: {{ .Values.frontend.service.type }}