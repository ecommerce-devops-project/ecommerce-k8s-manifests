apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-backend
  namespace: ecommerce

spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: ecommerce-backend

  template:
    metadata:
      labels:
        app: ecommerce-backend

    spec:
      containers:
        - name: ecommerce-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          ports:
            - containerPort: {{ .Values.backend.service.port }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: PORT
              value: "{{ .Values.backend.env.PORT }}"

            - name: NODE_ENV
              value: "{{ .Values.backend.env.NODE_ENV }}"

            - name: DB_USERNAME
              value: "{{ .Values.backend.secret.DB_USERNAME }}"

            - name: DB_PASSWORD
              value: "{{ .Values.backend.secret.DB_PASSWORD }}"

            - name: JWT_SECRET
              value: "{{ .Values.backend.secret.JWT_SECRET }}"

          volumeMounts:
            - name: ecommerce-storage
              mountPath: /data

      volumes:
        - name: ecommerce-storage
          persistentVolumeClaim:
            claimName: ecommerce-backend-pvc