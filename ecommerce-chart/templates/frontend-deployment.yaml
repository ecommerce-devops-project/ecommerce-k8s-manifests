apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommers-frontend
  namespace: ecommerce

spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: ecommers-frontend

  template:
    metadata:
      labels:
        app: ecommers-frontend

    spec:
      containers:
        - name: ecommers-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"

          ports:
            - containerPort: {{ .Values.frontend.service.port }}
