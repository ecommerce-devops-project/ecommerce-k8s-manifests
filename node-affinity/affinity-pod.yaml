apiVersion: v1
kind: Pod

metadata:
  name: affinity-demo
  namespace: ecommerce

spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: environment
            operator: In
            values:
            - dev

  containers:
  - name: nginx
    image: nginx
