apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-blue
  namespace: ecommerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend
      version: blue

  template:
    metadata:
      labels:
        app: backend
        version: blue

    spec:
      containers:
      - name: backend
        image: nginx

        ports:
        - containerPort: 80
