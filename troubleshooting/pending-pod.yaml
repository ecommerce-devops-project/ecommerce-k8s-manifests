apiVersion: v1
kind: Pod

metadata:
  name: pending-demo
  namespace: ecommerce

spec:
  containers:
  - name: pending-container
    image: busybox
    command: ["sh", "-c", "sleep 3600"]

    resources:
      requests:
        memory: "20Gi"
        cpu: "10"




